    immediateAvailableBalance: Float

    nextDayAvailableBalance: Float

    twoDaysPlusAvailableBalance: Float

    referenceBankId: String

    referenceBranchId: String

    referenceCustomerId: String

    commercialCode: CommercialCode
}

