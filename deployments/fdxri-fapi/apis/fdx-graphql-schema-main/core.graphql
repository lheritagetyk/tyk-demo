    purchasedPrice: Float

    costBasis: Float

    currentValue: Float

    positionType: PositionType
}

interface Transaction {
    # Omit accountCategory (handled by polymorphism)

    # Intentionally nested
    account: Account

    transactionId: ID

    """
    For reverse postings, the identity of the transaction being
    reversed. For the correction transaction, the identity of the
    reversing post. For credit card posting transactions, the identity
    of the authorization transaction
    """
    referenceTransaction: Transaction

    postedTimestamp: DateTime

    "The date and time that the transaction was added to the server backend systems"
    transactionTimestamp: DateTime

    """
    The description of the transaction, such as information about a merchant's
    name or place of business in a manner that is user friendly and accessible to the customer.
    Detailed information on a payee, such as address, can be sent in `transactionPayee`
    """
    description: String

    memo: String @length(max: 255)

    debitCreditMemo: DebitCreditMemo

    category: String

    subCategory: String

    reference: String

    status: TransactionStatus

    "The amount of money in the account currency"
    amount: Float

    "The amount of money in the foreign currency"
    foreignAmount: Float

    "The ISO 4217 code of the foreign currency"
    foreignCurrency: CurrencyCode

    "Images related to this transaction"
    images: [URI]

    lineItem: [LineItem!]

    reward: TransactionReward

    """
    The payment card number (e.g., debit, credit or digital), suitably masked,
    used to originate the transaction. May differ from primary account number as a
    secondary or employee card or a one-time use number. This is an optional field
    and won't be returned for certain types of transactions such as cash or check deposits
    """
    cardNumberDisplay: String

    "The merchant or individual payee who was involved in the transaction"
    transactionPayee: TransactionPayee
}

"""
Primary demographic information for payee on a transaction;
name, location, contact phone
"""
type TransactionPayee {

    """
    Name of the merchant (typically a business from which goods or services are rendered) or individual
    """
    name: BusinessOrIndividualName

    "Address of the payee who received the payment"
    address: DeliveryAddress

    "Phone number of the payee who received the payment"
    phone: TelephoneNumber
}

union BusinessOrIndividualName = BusinessName | IndividualName

type TransactionReward {
    category: RewardCategory

    accrued: Float

    adjusted: Float
}

interface Transactions implements PaginatedArray {
    page: PageMetadata
    transactions: [Transaction!]!
}

type TransferLimits {
    out: PaymentNetworkTransferLimits

    in: PaymentNetworkTransferLimits
}

type Vesting {
    vestingDate: Date

    Symbol: String

    strikePrice: Float

    vestingPercentage: Float

    otherVestAmount: Float

    otherVestPercentage: Float

    vestedBalance: Float

    unVestedBalance: Float

    vestedQuantity: Float

    unVestedQuantity: Float
}

