### Queries
extend type Query {
    searchForAccounts(pagination: Pagination): Accounts!

    getAccount(accountId: ID!): Account

    # Omit getAccountAssetTransferNetworks, getAccountContact, getAccountPaymentNetworks, searchForAccountStatements, searchForAccountTransactions (nested in Account)

    # Omit getAccountStatement, getAccountTransactionImages (can't return image; might replace with external URL)

    searchRewardPrograms(pagination: Pagination): RewardPrograms!

    getRewardProgram(rewardProgramId: ID!): RewardProgram

    # Omit getRewardProgramCategories (nested in RewardProgram)
}

### Schemas
interface Account {
    # Omit accountCategory - handled via polymorphism

    """
    Long-term persistent identity of the account, though not an account number.
    This identity must be unique to the owning institution
    """
    accountId: ID

    # Omit error - handled at the protocol level

    "Account type"
    accountType: AccountType

    """
    Full account number for the end user's handle for
    the account at the owning institution
    """
    accountNumber: String

    """
    Account display number for the end user's handle at the owning
    institution. This is to be displayed by the Interface Provider
    """
    accountNumberDisplay: String

    "Marketed product name for this account. Used in UIs to assist in account selection"
    productName: String

    "Name given by the user. Used in UIs to assist in account selection"
    nickname: String

    "Account status"
    status: AccountStatus

    description: String

    accountOpenDate: Date

    accountCloseDate: Date

    currency: Currency

    "Long-term persistent identity of the parent account. This is used to group accounts"
    parentAccount: Account

    "The line of business, such as consumer, consumer joint, small business, corporate, etc."
    lineOfBusiness: String

    """
    The routing transit number (RTN) associated with the account number at the owning institution.
    FDX v6.3 adds separate bankInstitutionId and bankTransitId properties and deprecates the prior
    approach to use this field for concatenated Canadian institution IDs
    """
    routingTransitNumber: String

    balanceType: BalanceType

    "Contact information associated with this account"
    contact: AccountContact

    interestRate: Float

    interestRateType: InterestRateType

    interestRateAsOf: DateTime

    """
    Variable rate index name such as
    EONIA, EURIBOR, EURREPO, FEFUND, LIBOR, PRIME, SOFR, SONIA, etc.
    """
    interestRateIndex: String

    earlyPenaltyFlag: Boolean

    transferIn: Boolean

    transferOut: Boolean

    billPayStatus: AccountBillPayStatus

    micrNumber: String @length(max: 64)

    lastActivityDate: Date

    # Intentionally nested
    rewardProgram: RewardProgram

    # Intentionally nested
    transactions(pagination: Pagination, datePagination: DatePagination): Transactions!

    domicile: Domicile

    # Intentionally nested
    assetTransferNetworks(pagination: Pagination): AssetTransferNetworkList

    # Intentionally nested
    paymentNetworkList(pagination: Pagination): AccountPaymentNetworkList

    # Intentionally nested
    statements(pagination: Pagination): Statements

    "The Canadian 3-digit Institution (FID) associated with the account number, including leading zeros"
    bankInstitutionId: String

    "The Canadian 5-digit Transit number associated with the account number, including leading zeros"
    bankTransitId: String
}

type AccountContact implements IContacts {
    "Array of the contact email addresses"
    emails: [String!]

    "Array of the contact physical addresses"
    addresses: [DeliveryAddress!]

    "Array of the contact telephone numbers"
    telephones: [TelephoneNumber!]

    "Owners of the account"
    holders: [AccountHolder!]
}

# Omit AccountDescriptor - merged into Account

type AccountHolder implements ICustomer & IPerson & IContacts {
    "Array of the contact email addresses"
    emails: [String!]

    "Array of the contact physical addresses"
    addresses: [DeliveryAddress!]

    "Array of the contact telephone numbers"
    telephones: [TelephoneNumber!]

    "The person's date of birth"
    dateOfBirth: Date

    """
    Country specific Tax Id associated with this customer.
    Masked as last four, e.g. xxx-xx-0123, or passed in encrypted payload.
    (SIN or NAS in Canada, SSN or TIN in US, etc.)
    """
    taxId: String

    "Country originating the Customer's taxId element"
    taxIdCountry: CountryCode

    "A federal (such as passport) or state (such as driver's license) issued identifier"
    governmentId: String

    """
    Long-term persistent identity of the customer.
    This identity must be unique to the owning institution
    """
    customerId: String

    "Type of entity. One of BUSINESS or CONSUMER"
    type: BusinessOrConsumer

    "The customer's name"
    name: CustomerName

    "The business customer information, only used if 'type' is 'BUSINESS'."
    businessCustomer: BusinessCustomer

    "The customer's start date at the financial institution"
    customerStartDate: Date

    "The customer's date of last account activity at the financial institution"
    lastActivityDate: Date

    "List of accounts related to this customer"
    accounts: CustomerToAccountRelationships
}

type AccountPaymentNetwork {
    """
    Bank identifier used by the payment network. Typically the 9-digit routing transit number (RTN)
    associated with the account number at a US institution. FDX v6.3 adds separate bankInstitutionId
    and bankTransitId properties and deprecates the prior approach to use this field for concatenated
    Canadian institution IDs
    """
    bankId: String

    """
    The number used to identify the account within the payment network.
    If identifierType is ACCOUNT_NUMBER, this is the account number;
    if identifierType is TOKENIZED_ACCOUNT_NUMBER, this is a tokenized account number
    """
    identifier: String

    identifierType: PaymentNetworkIdentifierType

    type: PaymentNetworkType

    transferIn: Boolean

    transferOut: Boolean

    supportsRequestForPayment: Boolean

    transferLimits: TransferLimits

    "The Canadian 3-digit Institution (FID) associated with the account number, including leading zeros"
    bankInstitutionId: String

    "The Canadian 5-digit Transit number associated with the account number, including leading zeros"
    bankTransitId: String
}

type AccountPaymentNetworkList implements PaginatedArray {
    page: PageMetadata
    paymentNetworks: [AccountPaymentNetwork!]
}

type Accounts implements PaginatedArray {
    page: PageMetadata
    accounts: [Account!]
}

