"""
Provider to define the date ranges and behaviors they will support.
Example of defined behavior:
 - Recipients need to either specify both start date and end date or neither. If both
    start date and end date are not specified; default provided. Default range: 7 Days
    of past data. (Today’s date - 6 days both dates are inclusive).
 - Recipient can specify the same start date and end date. The returned data will reflect
    transactions from that date.
 - If start date and end date both are specified and if start date is later than end date,
    return ‘invalid date range’ error.
 - If start Date and end date both are specified and if start date is older than what the
    Data Provider supports, then the Data Provider should return ‘invalid date range’
    error. Example: If today is 5/14/2024 and the
    DP supports 24 months, the start date should be 5/14/2022 and newer; it should not be
    5/13/2022 or older.
 - If start date is specified but end date is not specified or vice versa; Data Provider
    should return ‘invalid date range’ error.
"""
input DatePagination {
    startTime: Date @deprecated(reason: "Use startDate")
    "Start date for use in retrieval of elements"

    startDate: Date

    endTime: Date @deprecated(reason: "Use endDate")

    "End date for use in retrieval of elements"
    endDate: Date
}

