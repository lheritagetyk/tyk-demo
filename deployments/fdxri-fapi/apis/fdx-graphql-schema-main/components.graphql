"Types of relationships between accounts and holders. Suggested values"
enum AccountHolderRelationship {
    """
    An individual who has been given permission by the account owner/holder to
    sign checks, make withdrawals, and conduct transactions on behalf of an
    account holder for deposit account types, such as checking or savings, but
    does not own the account. They may also have an ability to make changes to
    the account (e.g., can close account)
    """
    AUTHORIZED_SIGNER
    """
    An individual added to a credit card account by the primary account holder,
    who has been authorized to make purchases using the card, but has no legal
    responsibility to repay the debt. The primary account holder remains legally
    responsible for repaying the debt for all charges incurred, including those
    of the Authorized User. Authorized User may not have access to the full
    account control (e.g., cannot close account)
    """
    AUTHORIZED_USER
    BUSINESS
    FOR_BENEFIT_OF
    FOR_BENEFIT_OF_PRIMARY
    FOR_BENEFIT_OF_PRIMARY_JOINT_RESTRICTED
    FOR_BENEFIT_OF_SECONDARY
    FOR_BENEFIT_OF_SECONDARY_JOINT_RESTRICTED
    FOR_BENEFIT_OF_SOLE_OWNER_RESTRICTED
    POWER_OF_ATTORNEY
    PRIMARY
    PRIMARY_BORROWER
    PRIMARY_JOINT
    PRIMARY_JOINT_TENANTS
    SECONDARY
    SECONDARY_BORROWER
    SECONDARY_JOINT
    SECONDARY_JOINT_TENANTS
    SOLE_OWNER
    TRUSTEE
    UNIFORM_TRANSFER_TO_MINOR
}

