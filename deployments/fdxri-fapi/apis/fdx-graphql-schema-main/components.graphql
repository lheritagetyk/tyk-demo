"""
Customers that are commercial in nature are affiliated with a business entity.
Japanese participants should send 'Kana' values in name fields using the
character set defined by Zengin (Japanese Banks' Payment Clearing Network)
"""
type BusinessCustomer {
    "Name of business customer"
    name: String

    "A list of registered agents who act on behalf of the business customer"
    registeredAgents: [CustomerName!]

    "The registered tax identification number (TIN) or other identifier of business customer"
    registeredId: String

    "Industry code and type"
    industryCode: IndustryCode

    "The country and region of the business customer's location"
    domicile: Domicile
}

"Name 1, Name 2"
interface IBusinessName {
    "Name line 1"
    name1: String

    "Name line 2"
    name2: String
}

"Name 1, Name 2"
type BusinessName implements IBusinessName {
    "Name line 1"
    name1: String

    "Name line 2"
    name2: String
}

"Contains all contact details for individual or business"
interface IContacts {
    "Array of the contact email addresses"
    emails: [String!]

    "Array of the contact physical addresses"
    addresses: [DeliveryAddress!]

    "Array of the contact telephone numbers"
    telephones: [TelephoneNumber!]
}
type Contacts implements IContacts {
    "Array of the contact email addresses"
    emails: [String!]

    "Array of the contact physical addresses"
    addresses: [DeliveryAddress!]

    "Array of the contact telephone numbers"
    telephones: [TelephoneNumber!]
}

"Represents a customer"
interface ICustomer implements IPerson & IContacts {
    "Array of the contact email addresses"
    emails: [String!]

    "Array of the contact physical addresses"
    addresses: [DeliveryAddress!]

    "Array of the contact telephone numbers"
    telephones: [TelephoneNumber!]

    "The person's date of birth"
    dateOfBirth: Date

    "Country specific Tax Id associated with this customer (SIN or NAS in Canada, SSN or TIN in US, etc.)"
    taxId: String

    "Country originating the Customer's taxId element"
    taxIdCountry: CountryCode

    "A federal (such as passport) or state (such as driver's license) issued identifier"
    governmentId: String

    """
    Long-term persistent identity of the customer.
    This identity must be unique to the owning institution
    """
    customerId: String

    "Type of entity. One of BUSINESS or CONSUMER"
    type: BusinessOrConsumer

    "The customer's name"
    name: CustomerName

    "The business customer information, only used if 'type' is 'BUSINESS'."
    businessCustomer: BusinessCustomer

    "The customer's start date at the financial institution"
    customerStartDate: Date

    "The customer's date of last account activity at the financial institution"
    lastActivityDate: Date

    "List of accounts related to this customer"
    accounts: CustomerToAccountRelationships
}

"Represents a customer"
type Customer implements ICustomer & IPerson & IContacts {
    "Array of the contact email addresses"
    emails: [String!]

    "Array of the contact physical addresses"
    addresses: [DeliveryAddress!]

    "Array of the contact telephone numbers"
    telephones: [TelephoneNumber!]

    "The person's date of birth"
    dateOfBirth: Date

    "Country specific Tax Id associated with this customer (SIN or NAS in Canada, SSN or TIN in US, etc.)"
    taxId: String

    "Country originating the Customer's taxId element"
    taxIdCountry: CountryCode

    "A federal (such as passport) or state (such as driver's license) issued identifier"
    governmentId: String

    """
    Long-term persistent identity of the customer.
    This identity must be unique to the owning institution
    """
    customerId: String

    "Type of entity. One of BUSINESS or CONSUMER"
    type: BusinessOrConsumer

    "The customer's name"
    name: CustomerName

    "The business customer information, only used if 'type' is 'BUSINESS'."
    businessCustomer: BusinessCustomer

    "The customer's start date at the financial institution"
    customerStartDate: Date

    "The customer's date of last account activity at the financial institution"
    lastActivityDate: Date

    "List of accounts related to this customer"
