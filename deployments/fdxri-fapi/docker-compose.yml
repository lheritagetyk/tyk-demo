services:
  postgres:
    image: us-docker.pkg.dev/fdx-ri-prod/ri/postgres:v62
    platform: linux/amd64
    container_name: postgres_container
    environment:
      POSTGRES_PASSWORD: F9@#t3jqz8r
    networks:
      - tyk 
    ports:
      - 7432:7432

  tomcat:
    image: us-docker.pkg.dev/fdx-ri-prod/ri/v62-copy:latest
    platform: linux/amd64
    container_name: fdxri-tomcat
    depends_on:
      - postgres
    networks:
      - tyk 
    ports:
      - 8090:8080
  keycloak-db:
    image: postgres:9.6
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - tyk
    ports:
      - 25432:5432
    volumes:
      - keycloak-data:/var/lib/postresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - keycloak
      interval: 30s
      timeout: 30s
      retries: 3
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
  keycloak:
    image: keycloak/keycloak:24.0.1
    depends_on:
      - keycloak-db
    networks:
      - tyk
    ports:
      - 8180:8180
    command:
      - start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_FEATURES: "token-exchange,admin-fine-grained-authz,dpop"
  tyk-grpc-plugin:
    build:
      context: ./deployments/fdxri-fapi/tyk-grpc-plugin
      dockerfile: Dockerfile
    container_name: tyk-grpc-plugin-fapi
    networks:
      - tyk
    ports:
      - "5555:5555"
    restart: unless-stopped
    # Optional: Mount private key if needed for JWS signing
    # volumes:
    #   - ./deployments/fdxri-fapi/tyk-grpc-plugin/private.pem:/app/private.pem:ro
    # Optional: Set JWS environment variables if needed
    # environment:
    #   - JWS_PRIVATE_KEY
    #   - JWS_PRIVATE_KEY_PATH
    #   - JWS_KEY_ID
    #   - JWS_ISSUER
  fdxwebui:
    build:
      context: ./deployments/fdxri-fapi/fdxwebui
      dockerfile: Dockerfile
    container_name: fdxwebui
    depends_on:
      - keycloak
    networks:
      - tyk
    ports:
      - "3010:3010"  # DPoP signing service
      - "3030:3030"   # Vite dev server
    environment:
      - NODE_ENV=development
      - VITE_KEYCLOAK_URL=http://keycloak:8180
      - VITE_KEYCLOAK_REALM=fapi-demo
      - VITE_CLIENT_ID=${VITE_CLIENT_ID:-fdx-sample-webapp}
      - VITE_REDIRECT_URI=${VITE_REDIRECT_URI:-http://localhost:3030/callback}
      - VITE_DPOP_SERVICE_URL=http://localhost:3010
      - VITE_FDX_CORE_API_URL=http://tyk-gateway.localhost:8080/fdxfapi
      - VITE_FDX_CUSTOMER_API_URL=http://tyk-gateway.localhost:8080/fdxapi
    volumes:
      # Mount source code for hot-reload (development)
      # Paths are relative to project root (where docker-compose is executed)
      - ./deployments/fdxri-fapi/fdxwebui/src:/app/src:ro
      - ./deployments/fdxri-fapi/fdxwebui/public:/app/public:ro
      - ./deployments/fdxri-fapi/fdxwebui/index.html:/app/index.html:ro
      - ./deployments/fdxri-fapi/fdxwebui/vite.config.js:/app/vite.config.js:ro
      - ./deployments/fdxri-fapi/fdxwebui/package.json:/app/package.json:ro
      # Mount DPoP service files for hot-reload
      - ./deployments/fdxri-fapi/fdxwebui/dpop-signing-service.js:/app/dpop-signing-service.js:ro
      # Mount keys (read-only)
      - ./deployments/fdxri-fapi/fdxwebui/dpop-keys.json:/app/dpop-keys.json:ro
      # Exclude node_modules from volume mount (use container's installed version)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
volumes:
  keycloak-data: null
networks:
  tyk-demo_tyk:
    external: true
  tyk:
    external: true
