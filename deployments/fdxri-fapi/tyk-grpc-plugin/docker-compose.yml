services:
  tyk-grpc-plugin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - JWS_PRIVATE_KEY
      - JWS_PRIVATE_KEY_PATH
      - JWS_KEY_ID
      - JWS_ISSUER
    volumes:
      - ./private.pem:/app/private.pem:ro
    networks:
      - tyk-network
